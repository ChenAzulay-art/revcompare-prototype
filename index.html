<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramdor · Drawing Compare</title>
<style>
  /* ---------- Base ---------- */
  :root {
    --bg: #f3f4f6; --surface: #fff; --border: #dfe3e8; --text: #1f2933; --muted: #6b7684;
    --accent: #1f5fa8; --accent-soft: #e8f0fa; --red: #c62828; --green: #1e7b45;
    --amber: #9a5800; --amber-soft: #fff3dc;
    --design: #1f5fa8; --data: #7b3fb0; --documentation: #0f8577; --minor: #8792a0;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  #app { flex: 1; min-height: 0; overflow: auto; }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; gap: 24px; height: 48px; padding: 0 16px; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { font-weight: 600; white-space: nowrap; }
  .crumbs { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs span { margin: 0 6px; color: #b5bcc5; }
  .role { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
  select { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 4px 8px; }

  /* ---------- Buttons, badges, tags ---------- */
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f5f7f9; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef0f3; color: var(--muted); font-size: 12px; font-weight: 500; }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #eef0f3; color: var(--muted); }
  .tag.crit { background: var(--red); color: #fff; }
  .tag.conf-high { background: #e7f3ec; color: var(--green); }
  .tag.conf-medium, .tag.conf-low { background: var(--amber-soft); color: var(--amber); }
  .t-design { --c: var(--design); } .t-data { --c: var(--data); }
  .t-documentation { --c: var(--documentation); } .t-minor { --c: var(--minor); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 2px solid var(--c); }
  .sw.crit { --c: var(--red); border-width: 3px; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px;
    border-radius: 4px; background: var(--c, var(--muted)); color: #fff; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .diff s { color: var(--red); }
  .diff ins { color: var(--accent); text-decoration: none; }

  /* ---------- Screen 1: Documents ---------- */
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.docs { width: 100%; border-collapse: collapse; }
  .docs th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
    padding: 8px 16px; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .docs td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .docs tr:last-child td { border-bottom: none; }
  .docs tr.clickable { cursor: pointer; }
  .docs tr.clickable:hover td { background: #f7faff; }
  .status { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .status.done { color: var(--green); font-weight: 500; }

  /* ---------- Screen 2: Compare ---------- */
  .compare { display: flex; flex-direction: column; height: 100%; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .warning { padding: 8px 16px; background: #fff8db; border-bottom: 1px solid #f0dc8a; color: #5c4a00; font-size: 13px; }
  .warning a { margin-left: 8px; font-weight: 500; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px 1fr; }

  .list { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); }
  .group-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--border);
    background: #fafbfc; font-weight: 600; text-align: left; cursor: pointer; position: sticky; top: 0; z-index: 1; }
  .group-head .count { margin-left: auto; color: var(--muted); font-weight: 500; }
  .chev { width: 12px; color: var(--muted); }
  .group-note { padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; scroll-margin-top: 40px; }
  .item:hover { background: #f9fafb; }
  .item.selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .item.done .item-body { opacity: .55; }
  .item-title { display: flex; gap: 8px; font-weight: 600; }
  .item-sub { margin-left: 28px; }
  .loc { font-size: 12px; color: var(--muted); }
  .item .diff { font-size: 13px; margin-top: 4px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 0 28px; }
  .retype { width: 72px; font-size: 12px; padding: 2px 4px; color: var(--muted); cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  .viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--border); background: var(--surface); padding: 5px 12px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .opacity { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; gap: 12px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .zoom { align-items: center; }
  .zoom button { width: 32px; padding: 5px 0; font-weight: 600; }
  .zoom span { min-width: 48px; text-align: center; font-size: 13px; color: var(--muted); border-right: 1px solid var(--border); }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px; }
  .stage.zoomed .frame { cursor: grab; }
  .stage.zoomed .frame:active { cursor: grabbing; }
  .stage.instant .canvas { transition: none; }
  /* Selected change details: a strip between toolbar and drawing, so it never covers the images */
  .detail-card { padding: 8px 16px; font-size: 13px; background: var(--surface); border-bottom: 1px solid var(--border);
    border-left: 3px solid var(--accent); }
  .detail-card .item-title { align-items: center; flex-wrap: wrap; }
  .detail-card .loc { font-weight: 400; }
  .detail-card .tags { margin: 0; }
  .detail-card .diff, .detail-card .note { margin: 2px 0 0 28px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .pane-label { padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  .frame { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #e9ecef; touch-action: none; user-select: none; }
  .canvas { --s: 1; position: absolute; left: 0; top: 0; background: #fff; transform-origin: 0 0; transition: transform .45s ease; }
  .canvas img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  /* Box borders are divided by the zoom factor (--s) so they keep a constant on-screen width */
  .box { position: absolute; border: calc(2px / var(--s)) solid var(--c, var(--accent)); border-radius: calc(3px / var(--s)); cursor: pointer; }
  .box:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
  .box.crit { border-color: var(--red); border-width: calc(4px / var(--s)); }
  .box.selected { box-shadow: 0 0 0 calc(4px / var(--s)) rgba(31, 95, 168, .35); }
  .box.pulse { animation: pulse .6s ease .4s 3; }
  @keyframes pulse { 50% { background: rgba(255, 196, 0, .45); } }
  .box span { position: absolute; left: 0; top: 0; padding: 0 calc(4px / var(--s)); background: var(--c); color: #fff;
    font-size: calc(11px / var(--s)); font-weight: 600; line-height: 1.5; border-bottom-right-radius: calc(3px / var(--s)); }

  .bottombar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 2; }
  .progress { flex: 1; display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; max-width: 320px; height: 8px; border-radius: 4px; background: #e6e9ed; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .3s; }

  /* ---------- Screen 3: Summary ---------- */
  .summary-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  .summary-head h1 { margin-bottom: 4px; }
  .summary-head p { margin: 0; }
  .actions { display: flex; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 24px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 16px 0 4px; }
  .sum-crit { padding: 8px 0; border-top: 1px solid var(--border); }
  .note { font-size: 13px; color: var(--red); margin-top: 4px; }
  .compact { list-style: none; margin: 0; padding: 0; }
  .compact li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px; }

  /* ---------- Smaller screens: narrower list, then stack below 700px ---------- */
  @media (max-width: 1100px) {
    .split { grid-template-columns: 300px 1fr; }
  }
  @media (max-width: 700px) {
    .compare { height: auto; }
    .split { display: block; }
    .list { border-right: 0; }
    .viewer { height: calc(100vh - 110px); }   /* fills the screen between header and bottom bar */
    .legend { margin-left: 0; }
  }

  /* ---------- Print: summary only ---------- */
  @media print {
    html, body { height: auto; display: block; background: #fff; }
    #app { overflow: visible; }
    .header, .no-print { display: none !important; }
    .page { padding: 0; max-width: none; }
    .card { border: 0; padding: 0; margin-bottom: 24px; }
    .sum-crit, .compact li { break-inside: avoid; }
    .num, .tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="brand">Ramdor · Documents</div>
    <nav class="crumbs" id="crumbs"></nav>
    <label class="role">Reviewing as <select id="role" data-action="role"></select></label>
  </header>
  <main id="app"></main>

<script>
/* =====================================================================
   DATA — copied from changes.json (fetch() is blocked on file://)
   ===================================================================== */
const DATA = {
  "sheet": {
    "number": "A-101",
    "title": "Typical Floor Plan",
    "discipline": "Architecture",
    "from": { "rev": "A", "uploadedBy": "Studio Levi Architects", "date": "2026-10-12", "image": "rev_A.png" },
    "to":   { "rev": "B", "uploadedBy": "Studio Levi Architects", "date": "2026-11-08", "image": "rev_B_aligned.png" }
  },
  "types": [
    { "id": "design",        "label": "Design",        "description": "Physical change: walls, rooms, openings, fixtures" },
    { "id": "data",          "label": "Data",          "description": "A value changed: area, dimension, label" },
    { "id": "documentation", "label": "Documentation", "description": "Information added to or removed from the sheet, no physical change" },
    { "id": "minor",         "label": "Minor",         "description": "Below the significance threshold, or technical. Hidden by default" }
  ],
  "changes": [
    { "id": 1,  "type": "design", "critical": false, "confidence": "high",
      "title": "Unit layout reworked", "location": "Near label: Unit 83 m²",
      "before": "Kitchen & living along north facade, master bedroom south-east",
      "after": "Bedroom moved to north-west corner, kitchen & living relocated east",
      "box": [0.59, 0.10, 0.91, 0.35] },
    { "id": 2,  "type": "design", "critical": false, "confidence": "high",
      "title": "Kitchen relocated, island added", "location": "Near label: Unit 69 m²",
      "before": "Linear kitchen on north wall",
      "after": "Kitchen on west wall with island",
      "box": [0.15, 0.10, 0.33, 0.24] },
    { "id": 3,  "type": "design", "critical": false, "confidence": "medium",
      "title": "Kitchen and bathroom reworked", "location": "Near label: Unit 143 m²",
      "before": "Kitchen with island; bathroom layout A",
      "after": "Linear kitchen, no island; bathroom fixtures rearranged",
      "box": [0.47, 0.53, 0.85, 0.70] },
    { "id": 4,  "type": "design", "critical": false, "confidence": "medium",
      "title": "Bathroom and bedroom walls shifted", "location": "Near label: Unit 122 m²",
      "before": "Bathroom between bedrooms 2 and 3",
      "after": "Bathroom moved, walls of bedrooms 2–3 shifted",
      "box": [0.15, 0.51, 0.37, 0.64] },
    { "id": 5,  "type": "data", "critical": true, "confidence": "high",
      "title": "Safe room (Mamad) area reduced", "location": "Near label: Unit 143 m²",
      "before": "15.08 m²", "after": "9.48 m²",
      "note": "Safe-room changes may require Home Front Command re-approval.",
      "box": [0.72, 0.54, 0.91, 0.61] },
    { "id": 6,  "type": "data", "critical": true, "confidence": "high",
      "title": "Unit area reduced", "location": "Unit label",
      "before": "147 m²", "after": "143 m²",
      "box": [0.57, 0.635, 0.69, 0.675] },
    { "id": 7,  "type": "data", "critical": false, "confidence": "high",
      "title": "Balcony area increased", "location": "Near label: Unit 69 m²",
      "before": "8.80 m²", "after": "12.80 m²",
      "box": [0.10, 0.23, 0.16, 0.34] },
    { "id": 8,  "type": "data", "critical": false, "confidence": "high",
      "title": "Balcony area increased", "location": "Near label: Unit 83 m²",
      "before": "9.95 m²", "after": "12.50 m²",
      "box": [0.75, 0.06, 0.95, 0.19] },
    { "id": 9,  "type": "documentation", "critical": false, "confidence": "high",
      "title": "Dimensions, grid lines and room labels removed", "location": "Whole sheet",
      "before": "Dimension chains, grid axes 1–8, room names and areas",
      "after": "Mostly missing",
      "note": "Rev B may not be sufficient for construction. Check before issuing to site.",
      "sheetWarning": true,
      "box": null },
    { "id": 10, "type": "minor", "critical": false, "confidence": "high",
      "title": "Balcony area recalculated", "location": "South balcony (west)",
      "before": "16.90 m²", "after": "16.95 m²",
      "box": [0.31, 0.80, 0.47, 0.87] },
    { "id": 11, "type": "minor", "critical": false, "confidence": "high",
      "title": "Balcony area recalculated", "location": "South balcony (east)",
      "before": "17.36 m²", "after": "17.41 m²",
      "box": [0.47, 0.80, 0.71, 0.87] },
    { "id": 12, "type": "minor", "critical": false, "confidence": "high",
      "title": "Sheet size and position changed (auto-aligned)", "location": "Whole sheet",
      "before": "533 × 711 pt", "after": "533 × 749 pt, drawing shifted ~35 pt",
      "box": null }
  ]
};

// Mock rows for the other sheets in the documents list (no detection data)
const OTHER_SHEETS = {
  sitePlan: { number: "A-100", title: "Site Plan", rev: "A", uploadedBy: "Studio Levi Architects", date: "2026-10-12" },
  sections: { number: "A-201", title: "Sections",  rev: "B", uploadedBy: "Studio Levi Architects", date: "2026-11-08" }
};

const ROLES = [
  { id: "pm",   label: "Project Manager" },
  { id: "dc",   label: "Design Coordinator" },
  { id: "arch", label: "Architect" }
];

/* =====================================================================
   STATE — everything lives in memory
   ===================================================================== */
const state = {
  screen: "documents",          // "documents" | "compare" | "summary"
  role: "pm",
  reviewed: Object.fromEntries(ROLES.map(r => [r.id, new Set()])),  // role id -> Set of change ids
  typeOverride: {},             // change id -> type id (reviewer reclassifications)
  collapsed: { minor: true },   // type id -> true when its group is collapsed
  selectedId: null,
  view: { scale: 1, cx: 0.5, cy: 0.5 },  // zoom level + image point (fractions) shown at the frame centre
  viewMode: "b",                // "side" | "overlay" | "b"
  opacity: 50                   // Rev B opacity in overlay mode (%)
};

let imgRatio = 1;               // image height / width, read once the image loads
const MAX_ZOOM = 8;             // manual zoom limit (auto-zoom to a change stops at 4)

/* ---------- Helpers: every count is computed from DATA ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const app = document.getElementById("app");

function fmtDate(value) {
  const d = typeof value === "string" ? new Date(value + "T00:00:00") : value;
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const fitView = () => ({ scale: 1, cx: 0.5, cy: 0.5 });

const findChange = id => DATA.changes.find(c => c.id === id);
const typeOf = c => state.typeOverride[c.id] || c.type;
const typeLabel = id => DATA.types.find(t => t.id === id).label;
const changesOfType = typeId => DATA.changes.filter(c => typeOf(c) === typeId);
const orderedChanges = () => DATA.types.flatMap(t => changesOfType(t.id));
const roleLabel = () => ROLES.find(r => r.id === state.role).label;
const isReviewed = c => state.reviewed[state.role].has(c.id);
const totalCount = () => DATA.changes.length;
const criticalCount = () => DATA.changes.filter(c => c.critical).length;
const reviewedCount = () => DATA.changes.filter(isReviewed).length;

/* =====================================================================
   RENDER: documents
   ===================================================================== */
function render() {
  document.getElementById("role").value = state.role;
  if (state.screen === "documents") renderDocuments();
  if (state.screen === "compare") renderCompare();
  if (state.screen === "summary") renderSummary();
}

function reviewStatusHTML() {
  const n = totalCount(), x = reviewedCount();
  if (n > 0 && x === n) return `<span class="status done">✓ Reviewed by you</span>`;
  if (x === 0) return `<span class="status">Not reviewed by you</span>`;
  return `<span class="status">${x} of ${n} reviewed by you</span>`;
}

function docRowHTML(doc, changesCell, clickable) {
  return `<tr ${clickable ? 'class="clickable" data-action="open-compare"' : ""}>
    <td><b>${doc.number}</b></td><td>${doc.title}</td><td>Rev ${doc.rev}</td>
    <td>${doc.uploadedBy}</td><td>${fmtDate(doc.date)}</td><td>${changesCell}</td></tr>`;
}

function renderDocuments() {
  const s = DATA.sheet;
  const a101 = { number: s.number, title: s.title, rev: s.to.rev, uploadedBy: s.to.uploadedBy, date: s.to.date };
  const badge = `<span class="badge accent">${plural(totalCount(), "change")} · ${criticalCount()} critical</span>${reviewStatusHTML()}`;
  app.innerHTML = `
    <div class="page">
      <h1>Floor plans</h1>
      <div class="table-card"><table class="docs">
        <thead><tr><th>Sheet</th><th>Title</th><th>Current rev</th><th>Uploaded by</th><th>Date</th><th>Changes</th></tr></thead>
        <tbody>
          ${docRowHTML(OTHER_SHEETS.sitePlan, '<span class="muted">—</span>', false)}
          ${docRowHTML(a101, badge, true)}
          ${docRowHTML(OTHER_SHEETS.sections, '<span class="badge">No changes detected</span>', false)}
        </tbody>
      </table></div>
    </div>`;
}

/* =====================================================================
   RENDER: compare
   ===================================================================== */
function renderCompare() {
  const s = DATA.sheet;
  const warn = DATA.changes.find(c => c.sheetWarning);
  app.innerHTML = `
    <div class="compare">
      <div class="topbar">
        <a href="#" data-action="go-documents">← Documents</a>
        <div><b>${s.number} ${s.title}</b> · Rev ${s.from.rev} (${fmtDate(s.from.date)}) → Rev ${s.to.rev} (${fmtDate(s.to.date)})
          <span class="muted">· uploaded by ${s.to.uploadedBy}</span></div>
      </div>
      ${warn ? `<div class="warning">⚠ <b>${esc(warn.title)}.</b> ${esc(warn.note)}
        <a href="#" data-action="select" data-id="${warn.id}">Show in list</a></div>` : ""}
      <div class="split">
        <aside class="list" id="list"></aside>
        <section class="viewer" id="viewer"></section>
      </div>
      <div class="bottombar" id="bottombar"></div>
    </div>`;
  renderList();
  renderViewer();
  renderBottomBar();
}

/* ---------- Change list ---------- */
function renderList() {
  document.getElementById("list").innerHTML = DATA.types.map(t => {
    const items = changesOfType(t.id);
    const open = !state.collapsed[t.id];
    return `
      <div class="group">
        <button class="group-head" data-action="toggle-group" data-type="${t.id}">
          <span class="chev">${open ? "▾" : "▸"}</span><i class="sw t-${t.id}"></i>${t.label}
          <span class="count">${items.length}</span>
        </button>
        ${!open && t.id === "minor" ? `<div class="group-note">Hidden by default — below significance threshold</div>` : ""}
        ${open ? items.map(itemHTML).join("") : ""}
      </div>`;
  }).join("");
}

function itemHTML(c) {
  const done = isReviewed(c);
  const otherTypes = DATA.types.filter(t => t.id !== typeOf(c));
  return `
    <div class="item ${c.id === state.selectedId ? "selected" : ""} ${done ? "done" : ""}" id="item-${c.id}" data-action="select" data-id="${c.id}">
      <div class="item-body">
        <div class="item-title"><span class="num t-${typeOf(c)}">${c.id}</span>${esc(c.title)}</div>
        <div class="item-sub">
          <div class="loc">${esc(c.location)}</div>
          <div class="diff"><s>${esc(c.before)}</s> → <ins>${esc(c.after)}</ins></div>
          ${tagsHTML(c)}
        </div>
      </div>
      <div class="controls">
        <select class="retype" data-action="retype" data-id="${c.id}" title="Reclassify">
          <option selected disabled hidden>Type ▾</option>
          ${otherTypes.map(t => `<option value="${t.id}">Move to ${t.label}</option>`).join("")}
        </select>
        <label class="check"><input type="checkbox" data-action="review" data-id="${c.id}" ${done ? "checked" : ""}> Mark reviewed</label>
      </div>
    </div>`;
}

function tagsHTML(c) {
  return `<div class="tags">
    ${c.critical ? `<span class="tag crit">Critical</span>` : ""}
    <span class="tag conf-${c.confidence}">${cap(c.confidence)} confidence</span>
  </div>`;
}

/* ---------- Drawing viewer ---------- */
function renderViewer() {
  const s = DATA.sheet;
  const imgA = `<img src="${s.from.image}" alt="Rev ${s.from.rev}">`;
  const imgB = `<img src="${s.to.image}" alt="Rev ${s.to.rev}">`;
  const labelA = `Rev ${s.from.rev} · ${fmtDate(s.from.date)}`;
  const labelB = `Rev ${s.to.rev} · ${fmtDate(s.to.date)}`;
  let panes;
  if (state.viewMode === "side") panes = paneHTML(labelA, imgA) + paneHTML(labelB, imgB);
  if (state.viewMode === "overlay") panes = paneHTML(`${labelB} over ${labelA}`,
    imgA + `<img class="top" src="${s.to.image}" alt="Rev ${s.to.rev}" style="opacity:${state.opacity / 100}">`);
  if (state.viewMode === "b") panes = paneHTML(labelB, imgB);

  const modes = [["side", "Side by side"], ["overlay", "Overlay"], ["b", `Rev ${s.to.rev} only`]];
  document.getElementById("viewer").innerHTML = `
    <div class="toolbar">
      <div class="seg">${modes.map(([id, label]) =>
        `<button data-action="mode" data-mode="${id}" class="${state.viewMode === id ? "on" : ""}">${label}</button>`).join("")}</div>
      ${state.viewMode === "overlay" ? `<label class="opacity">Rev ${s.to.rev} opacity
        <input type="range" min="0" max="100" value="${state.opacity}" data-action="opacity"></label>` : ""}
      <div class="seg zoom">
        <button data-action="zoom-out" title="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button data-action="zoom-in" title="Zoom in">+</button>
      </div>
      <button class="btn" data-action="fit">Show whole sheet</button>
      <div class="legend">
        ${DATA.types.map(t => `<span><i class="sw t-${t.id}"></i>${t.label}</span>`).join("")}
        <span><i class="sw crit"></i>Critical</span>
      </div>
    </div>
    <div class="detail-card" id="detail-card" hidden></div>
    <div class="stage">${panes}</div>`;
  updateViewer(false);
}

function paneHTML(label, images) {
  const boxes = DATA.changes.filter(c => c.box).map(c => {
    const [x0, y0, x1, y1] = c.box.map(v => v * 100);
    return `<div class="box" data-action="select" data-id="${c.id}"
      style="left:${x0}%;top:${y0}%;width:${x1 - x0}%;height:${y1 - y0}%"><span>${c.id}</span></div>`;
  }).join("");
  return `<div class="pane"><div class="pane-label">${label}</div>
    <div class="frame"><div class="canvas">${images}${boxes}</div></div></div>`;
}

// Updates boxes, info strip and zoom on the existing DOM (so the zoom can animate)
function updateViewer(pulse) {
  const sel = findChange(state.selectedId);

  document.querySelectorAll(".box").forEach(el => {
    const c = findChange(Number(el.dataset.id));
    el.className = `box t-${typeOf(c)}${c.critical ? " crit" : ""}${c.id === state.selectedId ? " selected" : ""}`;
    el.hidden = !!state.collapsed[typeOf(c)];
  });

  // Details of the selected change, pinned on the drawing
  const card = document.getElementById("detail-card");
  card.hidden = !sel;
  if (sel) card.innerHTML = `
    <div class="item-title"><span class="num t-${typeOf(sel)}">${sel.id}</span>${esc(sel.title)}
      <span class="loc">· ${esc(sel.location)}</span>${tagsHTML(sel)}</div>
    <div class="diff"><s>${esc(sel.before)}</s> → <ins>${esc(sel.after)}</ins></div>
    ${sel.note ? `<div class="note">${esc(sel.note)}</div>` : ""}`;

  // One shared view for every frame, so side-by-side panes stay comparable
  const { scale, cx, cy } = state.view;
  document.querySelectorAll(".frame").forEach(frame => {
    const { fw, fh, w, h } = frameFit(frame);
    const canvas = frame.querySelector(".canvas");
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.style.setProperty("--s", scale);
    canvas.style.transform = `translate(${fw / 2 - scale * w * cx}px, ${fh / 2 - scale * h * cy}px) scale(${scale})`;
  });
  document.querySelector(".stage").classList.toggle("zoomed", scale > 1);
  document.getElementById("zoom-level").textContent = Math.round(scale * 100) + "%";

  if (pulse) document.querySelectorAll(".box.selected").forEach(el => el.classList.add("pulse"));
}

// Size of the frame and of the image fitted inside it (at 100%)
function frameFit(frame) {
  const fw = frame.clientWidth, fh = frame.clientHeight;
  const w = Math.min(fw, fh / imgRatio);
  return { fw, fh, w, h: w * imgRatio };
}

// Centre the view on a change's box; whole-sheet changes reset to fit
function zoomToChange(c) {
  if (!c.box) return (state.view = fitView());
  const { fw, fh, w, h } = frameFit(document.querySelector(".frame"));
  const [x0, y0, x1, y1] = c.box;
  const scale = clamp(Math.min(0.6 * fw / ((x1 - x0) * w), 0.6 * fh / ((y1 - y0) * h)), 1, 4);
  state.view = { scale, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

// Manual zoom. With an anchor (wheel), the image point under the cursor stays put.
function zoomBy(factor, anchor) {
  const v = state.view;
  const scale = clamp(v.scale * factor, 1, MAX_ZOOM);
  let { cx, cy } = v;
  if (anchor) {
    const { fw, fh, w, h } = frameFit(anchor.frame);
    const r = anchor.frame.getBoundingClientRect();
    const mx = anchor.x - r.left - fw / 2, my = anchor.y - r.top - fh / 2;   // cursor offset from frame centre
    cx += mx / (v.scale * w) - mx / (scale * w);
    cy += my / (v.scale * h) - my / (scale * h);
  }
  state.view = scale === 1 ? fitView() : { scale, cx: clamp(cx, 0, 1), cy: clamp(cy, 0, 1) };
  updateViewer(false);
}

// Turn off the zoom animation while wheeling / dragging, so it follows the hand
function setInstant(on) {
  document.querySelector(".stage")?.classList.toggle("instant", on);
}

/* ---------- Bottom bar ---------- */
function renderBottomBar() {
  const n = totalCount(), x = reviewedCount(), left = n - x;
  const pct = n ? Math.round(x / n * 100) : 100;
  document.getElementById("bottombar").innerHTML = `
    <div class="progress">
      <span><b>${x} of ${n}</b> reviewed by you <span class="muted">(${roleLabel()})</span></span>
      <div class="bar"><div style="width:${pct}%"></div></div>
    </div>
    <button class="btn" data-action="next" ${left ? "" : "disabled"}>Next unreviewed</button>
    <span title="${left ? `${plural(left, "change")} left to review` : "All changes reviewed"}">
      <button class="btn primary" data-action="finish" ${left ? "disabled" : ""}>Finish review</button>
    </span>`;
}

/* =====================================================================
   RENDER: summary
   ===================================================================== */
function renderSummary() {
  const s = DATA.sheet;
  const critical = DATA.changes.filter(c => c.critical);
  app.innerHTML = `
    <div class="page">
      <div class="summary-head">
        <div>
          <h1>You've reviewed ${reviewedCount()} of ${plural(totalCount(), "change")}</h1>
          <p class="muted">${roleLabel()} · ${fmtDate(new Date())} · ${s.number} ${s.title}, Rev ${s.from.rev} → Rev ${s.to.rev}</p>
        </div>
        <div class="actions no-print">
          <button class="btn" data-action="export-pdf">Export PDF</button>
          <button class="btn primary" data-action="go-documents">Back to documents</button>
        </div>
      </div>
      <section class="card">
        <h2>Critical changes (${critical.length})</h2>
        ${critical.length ? critical.map(criticalHTML).join("") : `<p class="muted">No critical changes.</p>`}
      </section>
      <section class="card">
        <h2>All changes by type</h2>
        ${DATA.types.map(typeSummaryHTML).join("")}
      </section>
    </div>`;
}

function criticalHTML(c) {
  return `
    <div class="sum-crit">
      <div><span class="num t-${typeOf(c)}">${c.id}</span> <b>${esc(c.title)}</b> <span class="muted">· ${esc(c.location)}</span></div>
      <div class="diff"><s>${esc(c.before)}</s> → <ins>${esc(c.after)}</ins></div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
    </div>`;
}

function typeSummaryHTML(t) {
  const items = changesOfType(t.id);
  return `
    <h3><i class="sw t-${t.id}"></i>${t.label} <span class="muted">${items.length}</span></h3>
    <ul class="compact">
      ${items.length ? items.map(c => `
        <li><span class="num t-${t.id}">${c.id}</span>
          <span>${esc(c.title)} <span class="muted diff">— <s>${esc(c.before)}</s> → <ins>${esc(c.after)}</ins></span>
          ${state.typeOverride[c.id] ? `<span class="tag">reclassified from ${typeLabel(c.type)}</span>` : ""}</span></li>`).join("")
        : `<li class="muted">None</li>`}
    </ul>`;
}

/* ---------- PDF export: a plain-text PDF built by hand (no library, works offline) ---------- */
const PDF_TEXT = "0.12 0.16 0.2", PDF_GREY = "0.42 0.46 0.52", PDF_RED = "0.78 0.16 0.16";

// The summary as lines of text: { text, size, bold, color, indent, space (extra gap above) }
function summaryLines() {
  const s = DATA.sheet, lines = [];
  const add = (text, opt = {}) => lines.push({ text, size: 10, ...opt });
  const critical = DATA.changes.filter(c => c.critical);

  add(`You've reviewed ${reviewedCount()} of ${plural(totalCount(), "change")}`, { size: 18, bold: true });
  add(`${roleLabel()} - ${fmtDate(new Date())} - ${s.number} ${s.title}, Rev ${s.from.rev} -> Rev ${s.to.rev}`, { color: PDF_GREY });

  add(`Critical changes (${critical.length})`, { size: 13, bold: true, space: 16 });
  if (!critical.length) add("No critical changes.", { color: PDF_GREY });
  critical.forEach(c => {
    add(`#${c.id} ${c.title} - ${c.location}`, { bold: true, space: 6 });
    add(`${c.before} -> ${c.after}`);
    if (c.note) add(c.note, { color: PDF_RED });
  });

  add("All changes by type", { size: 13, bold: true, space: 16 });
  DATA.types.forEach(t => {
    const items = changesOfType(t.id);
    add(`${t.label} (${items.length})`, { size: 11, bold: true, space: 8 });
    if (!items.length) add("None", { color: PDF_GREY, indent: 12 });
    items.forEach(c => add(`#${c.id} ${c.title}: ${c.before} -> ${c.after}` +
      (state.typeOverride[c.id] ? ` (reclassified from ${typeLabel(c.type)})` : ""), { indent: 12 }));
  });
  return lines;
}

// Built-in PDF fonts only cover basic Latin, so swap the few special characters we use
const pdfSafe = s => String(s).replace(/→/g, "->").replace(/²/g, "2").replace(/[–—]/g, "-")
  .replace(/×/g, "x").replace(/·/g, "-").replace(/[^\x20-\x7E]/g, "?");
const pdfEscape = s => s.replace(/[\\()]/g, ch => "\\" + ch);

function wrapText(text, maxChars) {
  const out = [];
  let line = "";
  for (const word of text.split(" ")) {
    if (line && (line + " " + word).length > maxChars) { out.push(line); line = word; }
    else line = line ? line + " " + word : word;
  }
  return out.concat(line);
}

function buildPDF() {
  const W = 595, H = 842, M = 50;            // A4 in points, page margin
  const pages = [];
  let ops = [], y = H - M;
  for (const line of summaryLines()) {
    const indent = line.indent || 0;
    const maxChars = Math.floor((W - 2 * M - indent) / (line.size * 0.5));   // rough Helvetica width
    y -= line.space || 0;
    for (const part of wrapText(pdfSafe(line.text), maxChars)) {
      if (y - line.size * 1.4 < M) { pages.push(ops); ops = []; y = H - M; }   // new page
      y -= line.size * 1.4;
      ops.push(`BT /${line.bold ? "F2" : "F1"} ${line.size} Tf ${line.color || PDF_TEXT} rg ` +
        `${M + indent} ${y.toFixed(1)} Td (${pdfEscape(part)}) Tj ET`);
    }
  }
  pages.push(ops);

  // PDF objects: 1 catalog, 2 page list, 3-4 fonts, then a page + content stream per page
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>"
  ];
  const kids = pages.map(pageOps => {
    const stream = pageOps.join("\n");
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] ` +
      `/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${objs.length + 2} 0 R >>`);
    objs.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    return `${objs.length - 1} 0 R`;
  });
  objs[1] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`;

  let pdf = "%PDF-1.4\n";
  const offsets = objs.map((obj, i) => {
    const at = pdf.length;
    pdf += `${i + 1} 0 obj\n${obj}\nendobj\n`;
    return at;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` +
    offsets.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") +
    `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return pdf;
}

function downloadPDF() {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([buildPDF()], { type: "application/pdf" }));
  link.download = `${DATA.sheet.number}_review_summary.pdf`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function goTo(screen) {
  state.screen = screen;
  render();
}

function openCompare() {
  state.selectedId = null;
  state.view = fitView();
  goTo("compare");
}

// Select a change: expand its group, highlight it in the list and zoom to it on the drawing.
// source: "list" (clicked an item), "drawing" (clicked a box), "next" (Next unreviewed) or undefined (banner)
function selectChange(id, source) {
  const c = findChange(id);
  if (!c) return;
  state.selectedId = id;
  state.collapsed[typeOf(c)] = false;
  zoomToChange(c);
  renderList();
  updateViewer(true);
  const item = document.getElementById("item-" + id);
  const showDrawing = () => document.getElementById("viewer").scrollIntoView({ block: "start", behavior: "smooth" });
  if (source === "list") showDrawing();
  else if (source === "drawing") scrollListTo(item);
  else if (source === "next") { scrollListTo(item); showDrawing(); }
  else item.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// Scroll only inside the list panel (never the page), so clicking a box keeps the drawing in view
function scrollListTo(item) {
  const list = document.getElementById("list");
  const l = list.getBoundingClientRect(), r = item.getBoundingClientRect();
  const headerH = 40;   // sticky group header
  if (r.top < l.top + headerH || r.bottom > l.bottom) {
    list.scrollBy({ top: r.top - l.top - headerH, behavior: "smooth" });
  }
}

function nextUnreviewed() {
  const list = orderedChanges();
  const start = list.findIndex(c => c.id === state.selectedId);
  for (let i = 1; i <= list.length; i++) {
    const c = list[(start + i) % list.length];
    if (!isReviewed(c)) return selectChange(c.id, "next");
  }
}

function toggleReviewed(id, checked) {
  const set = state.reviewed[state.role];
  checked ? set.add(id) : set.delete(id);
  renderList();
  renderBottomBar();
}

function reclassify(id, typeId) {
  const c = findChange(id);
  if (typeId === c.type) delete state.typeOverride[id];
  else state.typeOverride[id] = typeId;
  renderList();
  updateViewer(false);
}

function toggleGroup(typeId) {
  state.collapsed[typeId] = !state.collapsed[typeId];
  renderList();
  updateViewer(false);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || justPanned) return;   // the click that ends a drag is not a selection
  if (el.tagName === "A") e.preventDefault();
  const id = Number(el.dataset.id);
  switch (el.dataset.action) {
    case "open-compare": openCompare(); break;
    case "go-documents": goTo("documents"); break;
    case "select":
      if (e.target.closest("label, select")) break;   // checkbox / type menu inside an item
      selectChange(id, el.classList.contains("item") ? "list" : el.classList.contains("box") ? "drawing" : undefined);
      break;
    case "toggle-group": toggleGroup(el.dataset.type); break;
    case "mode": state.viewMode = el.dataset.mode; renderViewer(); break;
    case "fit": state.view = fitView(); updateViewer(false); break;
    case "zoom-in": zoomBy(1.5); break;
    case "zoom-out": zoomBy(1 / 1.5); break;
    case "next": nextUnreviewed(); break;
    case "finish": goTo("summary"); break;
    case "export-pdf": downloadPDF(); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  const id = Number(el.dataset.id);
  switch (el.dataset.action) {
    case "role":
      state.role = el.value;
      if (state.screen === "compare") { renderList(); renderBottomBar(); } else render();
      break;
    case "review": toggleReviewed(id, el.checked); break;
    case "retype": reclassify(id, el.value); break;
  }
});

document.addEventListener("input", e => {
  if (e.target.dataset.action !== "opacity") return;
  state.opacity = Number(e.target.value);
  document.querySelector(".canvas img.top").style.opacity = state.opacity / 100;
});

// Mouse wheel / trackpad pinch on the drawing zooms toward the cursor
let wheelTimer;
document.addEventListener("wheel", e => {
  const frame = e.target.closest(".frame");
  if (!frame) return;
  e.preventDefault();
  setInstant(true);
  zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), { frame, x: e.clientX, y: e.clientY });
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => setInstant(false), 150);
}, { passive: false });

// Drag the drawing to pan when zoomed in
let drag = null, justPanned = false;
document.addEventListener("pointerdown", e => {
  const frame = e.target.closest(".frame");
  if (!frame || e.button !== 0 || state.view.scale <= 1) return;
  const { w, h } = frameFit(frame);
  drag = { x: e.clientX, y: e.clientY, cx: state.view.cx, cy: state.view.cy, w, h, moved: false };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;   // small moves are still clicks
  drag.moved = true;
  setInstant(true);
  const s = state.view.scale;
  state.view.cx = clamp(drag.cx - dx / (s * drag.w), 0, 1);
  state.view.cy = clamp(drag.cy - dy / (s * drag.h), 0, 1);
  updateViewer(false);
});
document.addEventListener("pointerup", () => {
  if (drag && drag.moved) {
    justPanned = true;
    setTimeout(() => (justPanned = false), 0);
  }
  drag = null;
  setInstant(false);
});

window.addEventListener("resize", () => {
  if (state.screen === "compare") updateViewer(false);
});

/* ---------- Init ---------- */
document.getElementById("crumbs").innerHTML =
  `Neve Rehovot – Building A <span>/</span> ${DATA.sheet.discipline} <span>/</span> Floor plans`;
document.getElementById("role").innerHTML =
  ROLES.map(r => `<option value="${r.id}">${r.label}</option>`).join("");

// Read the drawing's aspect ratio once, so boxes line up with the image at any size
const probe = new Image();
probe.onload = () => {
  imgRatio = probe.naturalHeight / probe.naturalWidth;
  if (state.screen === "compare") updateViewer(false);
};
probe.src = DATA.sheet.to.image;

render();
</script>
