<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramdor · Drawing Compare</title>
<style>
  /* ---------- Base ---------- */
  :root {
    --bg: #f3f4f6; --surface: #fff; --border: #dfe3e8; --text: #1f2933; --muted: #6b7684;
    --accent: #1f5fa8; --accent-soft: #e8f0fa; --red: #c62828; --green: #1e7b45;
    --amber: #9a5800; --amber-soft: #fff3dc;
    --design: #1f5fa8; --data: #7b3fb0; --documentation: #0f8577; --minor: #8792a0;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  #app { flex: 1; min-height: 0; overflow: auto; }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; gap: 24px; height: 48px; padding: 0 16px; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { font-weight: 600; white-space: nowrap; }
  .crumbs { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs span { margin: 0 6px; color: #b5bcc5; }
  .role { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
  select { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 4px 8px; }

  /* ---------- Buttons, badges, tags ---------- */
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f5f7f9; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef0f3; color: var(--muted); font-size: 12px; font-weight: 500; }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #eef0f3; color: var(--muted); }
  .tag.crit { background: var(--red); color: #fff; }
  .tag.conf-high { background: #e7f3ec; color: var(--green); }
  .tag.conf-medium, .tag.conf-low { background: var(--amber-soft); color: var(--amber); }
  .t-design { --c: var(--design); } .t-data { --c: var(--data); }
  .t-documentation { --c: var(--documentation); } .t-minor { --c: var(--minor); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 2px solid var(--c); }
  .sw.crit { --c: var(--red); border-width: 3px; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px;
    border-radius: 4px; background: var(--c, var(--muted)); color: #fff; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .diff s { color: var(--red); }
  .diff ins { color: var(--accent); text-decoration: none; }

  /* ---------- Screen 1: Documents ---------- */
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table.docs { width: 100%; border-collapse: collapse; }
  .docs th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
    padding: 8px 16px; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .docs td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .docs tr:last-child td { border-bottom: none; }
  .docs tr.clickable { cursor: pointer; }
  .docs tr.clickable:hover td { background: #f7faff; }
  .status { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .status.done { color: var(--green); font-weight: 500; }

  /* ---------- Screen 2: Compare ---------- */
  .compare { display: flex; flex-direction: column; height: 100%; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .warning { padding: 8px 16px; background: #fff8db; border-bottom: 1px solid #f0dc8a; color: #5c4a00; font-size: 13px; }
  .warning a { margin-left: 8px; font-weight: 500; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px 1fr; }

  .list { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); }
  .group-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--border);
    background: #fafbfc; font-weight: 600; text-align: left; cursor: pointer; position: sticky; top: 0; z-index: 1; }
  .group-head .count { margin-left: auto; color: var(--muted); font-weight: 500; }
  .chev { width: 12px; color: var(--muted); }
  .group-note { padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; scroll-margin-top: 40px; }
  .item:hover { background: #f9fafb; }
  .item.selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .item.done .item-body { opacity: .55; }
  .item-title { display: flex; gap: 8px; font-weight: 600; }
  .item-sub { margin-left: 28px; }
  .loc { font-size: 12px; color: var(--muted); }
  .item .diff { font-size: 13px; margin-top: 4px; }
  .tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 0 28px; }
  .retype { font-size: 12px; padding: 2px 4px; color: var(--muted); cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  .viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--border); background: var(--surface); padding: 5px 12px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .opacity { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; gap: 12px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .info { padding: 8px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--border); font-size: 13px; }
  .stage { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .pane-label { padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  .frame { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #e9ecef; }
  .canvas { --s: 1; position: absolute; left: 0; top: 0; background: #fff; transform-origin: 0 0; transition: transform .45s ease; }
  .canvas img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  /* Box borders are divided by the zoom factor (--s) so they keep a constant on-screen width */
  .box { position: absolute; border: calc(2px / var(--s)) solid var(--c, var(--accent)); border-radius: calc(3px / var(--s)); cursor: pointer; }
  .box:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
  .box.crit { border-color: var(--red); border-width: calc(4px / var(--s)); }
  .box.selected { box-shadow: 0 0 0 calc(4px / var(--s)) rgba(31, 95, 168, .35); }
  .box.pulse { animation: pulse .6s ease .4s 3; }
  @keyframes pulse { 50% { background: rgba(255, 196, 0, .45); } }
  .box span { position: absolute; left: 0; top: 0; padding: 0 calc(4px / var(--s)); background: var(--c); color: #fff;
    font-size: calc(11px / var(--s)); font-weight: 600; line-height: 1.5; border-bottom-right-radius: calc(3px / var(--s)); }

  .bottombar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 2; }
  .progress { flex: 1; display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; max-width: 320px; height: 8px; border-radius: 4px; background: #e6e9ed; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); transition: width .3s; }

  /* ---------- Screen 3: Summary ---------- */
  .summary-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  .summary-head h1 { margin-bottom: 4px; }
  .summary-head p { margin: 0; }
  .actions { display: flex; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 24px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 16px 0 4px; }
  .sum-crit { padding: 8px 0; border-top: 1px solid var(--border); }
  .note { font-size: 13px; color: var(--red); margin-top: 4px; }
  .compact { list-style: none; margin: 0; padding: 0; }
  .compact li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px; }

  /* ---------- Narrow screens: stack list and viewer ---------- */
  @media (max-width: 900px) {
    .compare { height: auto; }
    .split { display: block; }
    .list { border-right: 0; }
    .viewer { height: 70vh; }
    .legend { margin-left: 0; }
  }

  /* ---------- Print: summary only ---------- */
  @media print {
    html, body { height: auto; display: block; background: #fff; }
    #app { overflow: visible; }
    .header, .no-print { display: none !important; }
    .page { padding: 0; max-width: none; }
    .card { border: 0; padding: 0; margin-bottom: 24px; }
    .sum-crit, .compact li { break-inside: avoid; }
    .num, .tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="brand">Ramdor · Documents</div>
    <nav class="crumbs" id="crumbs"></nav>
    <label class="role">Reviewing as <select id="role" data-action="role"></select></label>
  </header>
  <main id="app"></main>

<script>
/* =====================================================================
   DATA — copied from changes.json (fetch() is blocked on file://)
   ===================================================================== */
const DATA = {
  "sheet": {
    "number": "A-101",
    "title": "Typical Floor Plan",
    "discipline": "Architecture",
    "from": { "rev": "A", "uploadedBy": "Studio Levi Architects", "date": "2026-10-12", "image": "rev_A.png" },
    "to":   { "rev": "B", "uploadedBy": "Studio Levi Architects", "date": "2026-11-08", "image": "rev_B_aligned.png" }
  },
  "types": [
    { "id": "design",        "label": "Design",        "description": "Physical change: walls, rooms, openings, fixtures" },
    { "id": "data",          "label": "Data",          "description": "A value changed: area, dimension, label" },
    { "id": "documentation", "label": "Documentation", "description": "Information added to or removed from the sheet, no physical change" },
    { "id": "minor",         "label": "Minor",         "description": "Below the significance threshold, or technical. Hidden by default" }
  ],
  "changes": [
    { "id": 1,  "type": "design", "critical": false, "confidence": "high",
      "title": "Unit layout reworked", "location": "Near label: Unit 83 m²",
      "before": "Kitchen & living along north facade, master bedroom south-east",
      "after": "Bedroom moved to north-west corner, kitchen & living relocated east",
      "box": [0.59, 0.10, 0.91, 0.35] },
    { "id": 2,  "type": "design", "critical": false, "confidence": "high",
      "title": "Kitchen relocated, island added", "location": "Near label: Unit 69 m²",
      "before": "Linear kitchen on north wall",
      "after": "Kitchen on west wall with island",
      "box": [0.15, 0.10, 0.33, 0.24] },
    { "id": 3,  "type": "design", "critical": false, "confidence": "medium",
      "title": "Kitchen and bathroom reworked", "location": "Near label: Unit 143 m²",
      "before": "Kitchen with island; bathroom layout A",
      "after": "Linear kitchen, no island; bathroom fixtures rearranged",
      "box": [0.47, 0.53, 0.85, 0.70] },
    { "id": 4,  "type": "design", "critical": false, "confidence": "medium",
      "title": "Bathroom and bedroom walls shifted", "location": "Near label: Unit 122 m²",
      "before": "Bathroom between bedrooms 2 and 3",
      "after": "Bathroom moved, walls of bedrooms 2–3 shifted",
      "box": [0.15, 0.51, 0.37, 0.64] },
    { "id": 5,  "type": "data", "critical": true, "confidence": "high",
      "title": "Safe room (Mamad) area reduced", "location": "Near label: Unit 143 m²",
      "before": "15.08 m²", "after": "9.48 m²",
      "note": "Safe-room changes may require Home Front Command re-approval.",
      "box": [0.72, 0.54, 0.91, 0.61] },
    { "id": 6,  "type": "data", "critical": true, "confidence": "high",
      "title": "Unit area reduced", "location": "Unit label",
      "before": "147 m²", "after": "143 m²",
      "box": [0.57, 0.635, 0.69, 0.675] },
    { "id": 7,  "type": "data", "critical": false, "confidence": "high",
      "title": "Balcony area increased", "location": "Near label: Unit 69 m²",
      "before": "8.80 m²", "after": "12.80 m²",
      "box": [0.10, 0.23, 0.16, 0.34] },
    { "id": 8,  "type": "data", "critical": false, "confidence": "high",
      "title": "Balcony area increased", "location": "Near label: Unit 83 m²",
      "before": "9.95 m²", "after": "12.50 m²",
      "box": [0.75, 0.06, 0.95, 0.19] },
    { "id": 9,  "type": "documentation", "critical": false, "confidence": "high",
      "title": "Dimensions, grid lines and room labels removed", "location": "Whole sheet",
      "before": "Dimension chains, grid axes 1–8, room names and areas",
      "after": "Mostly missing",
      "note": "Rev B may not be sufficient for construction. Check before issuing to site.",
      "sheetWarning": true,
      "box": null },
    { "id": 10, "type": "minor", "critical": false, "confidence": "high",
      "title": "Balcony area recalculated", "location": "South balcony (west)",
      "before": "16.90 m²", "after": "16.95 m²",
      "box": [0.31, 0.80, 0.47, 0.87] },
    { "id": 11, "type": "minor", "critical": false, "confidence": "high",
      "title": "Balcony area recalculated", "location": "South balcony (east)",
      "before": "17.36 m²", "after": "17.41 m²",
      "box": [0.47, 0.80, 0.71, 0.87] },
    { "id": 12, "type": "minor", "critical": false, "confidence": "high",
      "title": "Sheet size and position changed (auto-aligned)", "location": "Whole sheet",
      "before": "533 × 711 pt", "after": "533 × 749 pt, drawing shifted ~35 pt",
      "box": null }
  ]
};

// Mock rows for the other sheets in the documents list (no detection data)
const OTHER_SHEETS = {
  sitePlan: { number: "A-100", title: "Site Plan", rev: "A", uploadedBy: "Studio Levi Architects", date: "2026-10-12" },
  sections: { number: "A-201", title: "Sections",  rev: "B", uploadedBy: "Studio Levi Architects", date: "2026-11-08" }
};

const ROLES = [
  { id: "pm",   label: "Project Manager" },
  { id: "dc",   label: "Design Coordinator" },
  { id: "arch", label: "Architect" }
];

/* =====================================================================
   STATE — everything lives in memory
   ===================================================================== */
const state = {
  screen: "documents",          // "documents" | "compare" | "summary"
  role: "pm",
  reviewed: Object.fromEntries(ROLES.map(r => [r.id, new Set()])),  // role id -> Set of change ids
  typeOverride: {},             // change id -> type id (reviewer reclassifications)
  collapsed: { minor: true },   // type id -> true when its group is collapsed
  selectedId: null,
  zoomed: false,                // true = zoomed to the selected change's box
  viewMode: "b",                // "side" | "overlay" | "b"
  opacity: 50                   // Rev B opacity in overlay mode (%)
};

let imgRatio = 1;               // image height / width, read once the image loads

/* ---------- Helpers: every count is computed from DATA ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const app = document.getElementById("app");

function fmtDate(value) {
  const d = typeof value === "string" ? new Date(value + "T00:00:00") : value;
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const findChange = id => DATA.changes.find(c => c.id === id);
const typeOf = c => state.typeOverride[c.id] || c.type;
const typeLabel = id => DATA.types.find(t => t.id === id).label;
const changesOfType = typeId => DATA.changes.filter(c => typeOf(c) === typeId);
const orderedChanges = () => DATA.types.flatMap(t => changesOfType(t.id));
const roleLabel = () => ROLES.find(r => r.id === state.role).label;
const isReviewed = c => state.reviewed[state.role].has(c.id);
const totalCount = () => DATA.changes.length;
const criticalCount = () => DATA.changes.filter(c => c.critical).length;
const reviewedCount = () => DATA.changes.filter(isReviewed).length;

/* =====================================================================
   RENDER: documents
   ===================================================================== */
function render() {
  document.getElementById("role").value = state.role;
  if (state.screen === "documents") renderDocuments();
  if (state.screen === "compare") renderCompare();
  if (state.screen === "summary") renderSummary();
}

function reviewStatusHTML() {
  const n = totalCount(), x = reviewedCount();
  if (n > 0 && x === n) return `<span class="status done">✓ Reviewed by you</span>`;
  if (x === 0) return `<span class="status">Not reviewed by you</span>`;
  return `<span class="status">${x} of ${n} reviewed by you</span>`;
}

function docRowHTML(doc, changesCell, clickable) {
  return `<tr ${clickable ? 'class="clickable" data-action="open-compare"' : ""}>
    <td><b>${doc.number}</b></td><td>${doc.title}</td><td>Rev ${doc.rev}</td>
    <td>${doc.uploadedBy}</td><td>${fmtDate(doc.date)}</td><td>${changesCell}</td></tr>`;
}

function renderDocuments() {
  const s = DATA.sheet;
  const a101 = { number: s.number, title: s.title, rev: s.to.rev, uploadedBy: s.to.uploadedBy, date: s.to.date };
  const badge = `<span class="badge accent">${plural(totalCount(), "change")} · ${criticalCount()} critical</span>${reviewStatusHTML()}`;
  app.innerHTML = `
    <div class="page">
      <h1>Floor plans</h1>
      <div class="table-card"><table class="docs">
        <thead><tr><th>Sheet</th><th>Title</th><th>Current rev</th><th>Uploaded by</th><th>Date</th><th>Changes</th></tr></thead>
        <tbody>
          ${docRowHTML(OTHER_SHEETS.sitePlan, '<span class="muted">—</span>', false)}
          ${docRowHTML(a101, badge, true)}
          ${docRowHTML(OTHER_SHEETS.sections, '<span class="badge">No changes detected</span>', false)}
        </tbody>
      </table></div>
    </div>`;
}

/* =====================================================================
   RENDER: compare
   ===================================================================== */
function renderCompare() {
  app.innerHTML = `<div class="page">Compare view — coming next. <a href="#" data-action="go-documents">← Documents</a></div>`;
}

/* =====================================================================
   RENDER: summary
   ===================================================================== */
function renderSummary() {
  app.innerHTML = "";
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function goTo(screen) {
  state.screen = screen;
  render();
}

function openCompare() {
  state.selectedId = null;
  state.zoomed = false;
  goTo("compare");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  switch (el.dataset.action) {
    case "open-compare": openCompare(); break;
    case "go-documents": goTo("documents"); break;
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  switch (el.dataset.action) {
    case "role": state.role = el.value; render(); break;
  }
});

/* ---------- Init ---------- */
document.getElementById("crumbs").innerHTML =
  `Neve Rehovot – Building A <span>/</span> ${DATA.sheet.discipline} <span>/</span> Floor plans`;
document.getElementById("role").innerHTML =
  ROLES.map(r => `<option value="${r.id}">${r.label}</option>`).join("");
render();
</script>
</body>
</html>
